spring.main.banner-mode=off
spring.main.web-application-type=none
spring.activiti.database-schema-update=true
# Mandatory engine settings (docs/adr/0005-scenario-format.md, "Required engine configuration for the runner")
spring.activiti.history-level=full
spring.activiti.db-history-used=true
spring.activiti.deployment-mode=default
spring.activiti.process-definition-location-suffixes=**.bpmn20.xml,**.bpmn,**.dmn
spring.activiti.async-executor-activate=false
logging.level.root=WARN
logging.level.org.operaton.bpm.dmn=ERROR
# Tests choose what they deploy; nothing is found on the classpath by default.
spring.activiti.process-definition-location-prefix=classpath*:/no-such-processes-dir/
# The scenario runner is an optional dependency of this module (it provides the DecisionEvaluator adapter). These tests
# have their own recorder and user store; the corpus is run with the real runner by the verification harness.
activiti.scenario.enabled=false
