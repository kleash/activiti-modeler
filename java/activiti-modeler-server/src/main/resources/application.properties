spring.application.name=activiti-modeler-server
spring.jmx.enabled=false

# --- Network: this server deploys and runs arbitrary models. It listens on this machine only. -------------------------------------
server.address=127.0.0.1
# The port is not set here: "java -jar" (main) tries 8080 and falls back to a free port; --port=<n> / --server.port=<n> force one.
# Without main (tests) Spring Boot's own default, 8080, applies.

# --- Engine: the settings the REST API and the scenario runner require (docs/adr/0005, 0007). -----------------------------------
# In-memory database: gone when the server stops. For a file database add e.g.
#   --spring.datasource.url=jdbc:h2:file:./modeler-data/engine;AUTO_SERVER=FALSE
spring.datasource.url=jdbc:h2:mem:modeler;DB_CLOSE_DELAY=-1
spring.activiti.database-schema-update=true
spring.activiti.history-level=full
spring.activiti.db-history-used=true
spring.activiti.deployment-mode=default
spring.activiti.process-definition-location-suffixes=**.bpmn20.xml,**.bpmn,**.dmn
# The async executor runs asynchronous jobs and timers; the scenario runner drives it in EXECUTOR mode.
spring.activiti.async-executor-activate=true

# --- REST API --------------------------------------------------------------------------------------------------------------------
activiti.rest.base-path=/api
activiti.rest.roles.read=ROLE_ACTIVITI_USER
activiti.rest.roles.operate=ROLE_ACTIVITI_USER
activiti.rest.roles.admin=ROLE_ACTIVITI_ADMIN
# The dev endpoints (validate, deploy, scenario run, decisions, workspace, mail): this server exists for them.
activiti.rest.dev.enabled=true
# Errors that happen before a controller is chosen (405, 415, unknown paths) as problem+json as well.
spring.mvc.problemdetails.enabled=true

# --- Modeler server ---------------------------------------------------------------------------------------------------------------
# Shell tasks run commands on this machine: refused at deployment unless you allow them.
modeler.server.allow-shell-tasks=false
# CORS for the app served by "vite dev" (5173) and "vite preview" (4173). The bundled app is same-origin and needs none.
modeler.server.cors.allowed-origins=http://localhost:5173,http://localhost:4173
# Embedded SMTP server for mail tasks (port 0: a free one).
modeler.server.mail.enabled=true
modeler.server.mail.port=0
# Demo users for HTTP Basic (passwords are plain text: "{noop}" is implied; use "{bcrypt}..." for a hash).
modeler.server.users.modeler.password=modeler
modeler.server.users.modeler.authorities=ROLE_ACTIVITI_USER,ROLE_ACTIVITI_ADMIN,GROUP_modelers,GROUP_clerks,GROUP_reviewers,GROUP_managers
modeler.server.users.alice.password=alice
modeler.server.users.alice.authorities=ROLE_ACTIVITI_USER,GROUP_clerks,GROUP_reviewers
modeler.server.users.bob.password=bob
modeler.server.users.bob.authorities=ROLE_ACTIVITI_USER,GROUP_managers
# The project folder. Not set here: "java -jar" (main) uses ~/ActivitiModeler/workspace unless --workspace=<folder> says otherwise;
# without main (tests) there is no workspace and the workspace endpoints answer 404. See launch/StartupDefaults.
#modeler.workspace.dir=./projects

# --- OpenAPI ----------------------------------------------------------------------------------------------------------------------
springdoc.packages-to-scan=io.github.kleash.activiti
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

logging.level.org.activiti=WARN
logging.level.org.springframework=WARN
