spring.application.name=rest-dev-test
spring.datasource.url=jdbc:h2:mem:rest-dev-test;DB_CLOSE_DELAY=-1
spring.activiti.database-schema-update=true
spring.activiti.history-level=full
spring.activiti.db-history-used=true
spring.activiti.deployment-mode=default
spring.activiti.process-definition-location-suffixes=**.bpmn20.xml,**.bpmn,**.dmn
# EXECUTOR job driving, as in the modeler server
spring.activiti.async-executor-activate=true
spring.activiti.async-executor.default-timer-job-acquire-wait-time-in-millis=100
spring.activiti.async-executor.default-async-job-acquire-wait-time-in-millis=100
activiti.scenario.executor-timeout=20s
activiti.rest.dev.enabled=true
logging.level.org.activiti=WARN
logging.level.org.springframework=WARN
springdoc.packages-to-scan=io.github.kleash.activiti.rest.dev.web
springdoc.paths-to-match=/api/dev/**
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
