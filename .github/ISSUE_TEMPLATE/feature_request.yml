name: Feature request
description: Something the modeler should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: The task you are trying to get done, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: For a BPMN or DMN feature, name the Activiti attribute or the engine behaviour it relies on, if you know it.
  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
