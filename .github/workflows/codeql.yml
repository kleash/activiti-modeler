name: CodeQL

# Code scanning of the Java and TypeScript sources. Results appear under Security > Code scanning. Java is built by hand
# (java-kotlin needs a build that CodeQL can watch): the wrapper compiles every module without tests. JavaScript and TypeScript need no build.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  # a newer push replaces a run of a pull request; on main every run finishes, so the README badge never shows a cancelled run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # upload the results
      actions: read            # the workflow run's metadata, needed by the upload in private repositories
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: java-kotlin, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Java modules (no tests, no web app)
        if: matrix.language == 'java-kotlin'
        run: ./java/mvnw -B -f java/pom.xml -DskipTests compile

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
