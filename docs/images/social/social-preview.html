<!doctype html>
<!--
  Source of social-preview.png, the repository's social preview image (1280 x 640).
  Render it from the repository root with the Playwright of the modeler workspace:
    npx --prefix modeler playwright screenshot --viewport-size=1280,640 "file://$PWD/docs/images/social/social-preview.html" docs/images/social/social-preview.png
  The screenshot is docs/images/showcase/bpmn-editor.png; its bpmn.io watermark stays visible.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activiti Modeler</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    position: relative;
    background: #f3f5f8;
    color: #111827;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .text {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 470px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .bar {
    width: 72px;
    height: 8px;
    border-radius: 4px;
    background: #1d6ae5;
    margin-bottom: 32px;
  }
  h1 {
    margin: 0;
    font-size: 80px;
    line-height: 1.02;
    font-weight: 750;
    letter-spacing: -1.5px;
  }
  p {
    margin: 30px 0 0;
    font-size: 34px;
    line-height: 1.3;
    color: #374151;
    text-wrap: balance;
  }
  .shot {
    position: absolute;
    left: 590px;
    top: 104px;
    width: 768px;
    height: 480px;
    border-radius: 14px;
    border: 1px solid #d5dae1;
    background: #fff url("../showcase/bpmn-editor.png") 0 0 / 768px 480px no-repeat;
    box-shadow: 0 18px 48px rgba(17, 24, 39, 0.16), 0 2px 6px rgba(17, 24, 39, 0.08);
  }
</style>
</head>
<body>
  <div class="text">
    <div class="bar"></div>
    <h1>Activiti Modeler</h1>
    <p>BPMN and DMN for Activiti&nbsp;9, checked and run on the real engine</p>
  </div>
  <div class="shot" role="img" aria-label="The modeler: a BPMN process with the Activiti properties panel"></div>
</body>
</html>
