spring.application.name=rest-core-test
spring.datasource.url=jdbc:h2:mem:rest-core-test;DB_CLOSE_DELAY=-1
spring.activiti.database-schema-update=true
spring.activiti.history-level=full
spring.activiti.db-history-used=true
spring.activiti.deployment-mode=default
# Jobs are driven by the tests (through the REST API), not by an executor.
spring.activiti.async-executor-activate=false
logging.level.org.activiti=WARN
logging.level.org.springframework=WARN
logging.level.io.github.kleash=INFO
# OpenAPI export test: describe the core controllers only, in a stable way
springdoc.packages-to-scan=io.github.kleash.activiti.rest.core.web
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
