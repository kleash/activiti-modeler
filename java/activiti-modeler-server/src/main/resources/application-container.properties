# Profile "container": the Docker image (SPRING_PROFILES_ACTIVE=container, see Dockerfile and docs/adr/0008-distribution.md).
# Inside the container the server must listen on all addresses or the published port could not reach it. Keep the port on the host's
# loopback address when you publish it:  docker run -p 127.0.0.1:8080:8080 ...  Security of that choice: launch/ContainerCredentials
# replaces the demo passwords with MODELER_PASSWORD or a random one printed at start.
server.address=0.0.0.0
server.port=8080
modeler.workspace.dir=/data
modeler.server.open-browser=false
modeler.server.status-window=false
# Logs go to the container's output only (docker logs).
logging.file.name=
